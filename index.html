    <!-- camera-controls -->
    <!-- https://modelviewer.dev/examples/stagingandcameras/#cameraOrbit-->
    <!-- auto-rotate -->
    <!-- 3d model by bohmerang on skechfab-->
    <!-- les orbites sont définies avec X, Y, Distance par rapport au centre du model-->
    <model-viewer
        class="Rafale1"
        id="Rafale1"
        src="assets/Dassault-Rafale.glb"
        interpolation-decay="100"
    ></model-viewer>

    <script>
        (() => {
        const modelViewer = document.querySelector('#Rafale1');
        const orbitCycle = [
            '-33deg 80deg 2m',
            modelViewer.cameraOrbit,
            '60deg 70deg 4m',
            '3deg 100deg 1m'
        ];

        setInterval(() => {
            const currentOrbitIndex = orbitCycle.indexOf(modelViewer.cameraOrbit);
            modelViewer.cameraOrbit =
                orbitCycle[(currentOrbitIndex + 1) % orbitCycle.length];
        }, 2000);
        })();
    </script>

    <h1 class="title">RAFALE F4</h1>
